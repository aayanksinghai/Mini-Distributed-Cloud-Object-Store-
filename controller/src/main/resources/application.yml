server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: controller
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/objectstore}
    username: ${DB_USER:objectstore}
    password: ${DB_PASSWORD:objectstore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_OBJECT_SIZE:1GB}
      max-request-size: ${MAX_OBJECT_SIZE:1GB}
      # Spool uploads to disk instead of buffering whole objects in memory.
      file-size-threshold: 2MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

objectstore:
  storage:
    chunk-size: ${CHUNK_SIZE_BYTES:1048576}B
    replication-factor: ${REPLICATION_FACTOR:2}
    max-object-size: ${MAX_OBJECT_SIZE:1GB}
  cluster:
    heartbeat-timeout: ${HEARTBEAT_TIMEOUT_MS:10000}ms
    heartbeat-check-interval: ${HEARTBEAT_CHECK_INTERVAL_MS:2000}ms
    re-replication-grace-period: ${REREPLICATION_GRACE_PERIOD_MS:30000}ms
    repair-interval: ${REPAIR_INTERVAL_MS:10000}ms
    worker-request-timeout: ${WORKER_REQUEST_TIMEOUT_MS:5000}ms
  internal:
    api-token: ${INTERNAL_API_TOKEN:change-me-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.objectstore: ${APP_LOG_LEVEL:INFO}

